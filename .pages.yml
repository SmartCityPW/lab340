# Konfiguracja Pages CMS (https://pagescms.org/docs/configuration/)
# Określa, co osoby nietechniczne mogą edytować w panelu i jakimi polami.

media:
  - name: images
    label: Zdjęcia
    input: docs/images
    output: /images          # szablon strony sam przepisuje to na właściwą ścieżkę
    categories: [image]
    rename: safe
  - name: pliki
    label: Pliki (PDF, instrukcje producenta)
    input: docs/pliki
    output: /pliki
    categories: [document, spreadsheet, compressed]
    rename: safe

content:
  - name: ogolne
    label: Strony ogólne
    type: group
    items:
      - name: strona-glowna
        label: Strona główna
        type: file
        path: docs/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Tytuł
            type: string
            required: true
          - name: body
            label: Treść
            type: rich-text
            options:
              format: markdown
              media: images

      - name: bhp
        label: BHP i regulamin
        type: file
        path: docs/bhp-i-regulamin.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Tytuł
            type: string
            required: true
          - name: body
            label: Treść
            type: rich-text
            options:
              format: markdown
              media: images

  - name: stanowiska
    label: Stanowiska
    type: collection
    path: docs/stanowiska
    format: yaml-frontmatter
    exclude: [index.md]
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
    fields:
      - name: title
        label: Nazwa stanowiska
        type: string
        required: true
      - name: zdjecie
        label: Zdjęcie stanowiska
        type: image
        options:
          media: images
      - name: body
        label: Opis i procedury
        description: Do czego służy stanowisko, co zrobić przed i po pracy. Lista aparatury dopisze się sama.
        type: rich-text
        options:
          format: markdown
          media: images

  - name: instrukcje
    label: Instrukcje
    type: collection
    path: docs/instrukcje
    format: yaml-frontmatter
    exclude: [index.md]
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
    fields:
      - name: title
        label: Tytuł instrukcji
        type: string
        required: true
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown
          media: images

  - name: aparatura
    label: Aparatura
    type: collection
    path: docs/aparatura
    format: yaml-frontmatter
    exclude: [index.md]
    filename: "{primary}.md"
    view:
      fields: [title, nr_inwentarzowy, stan]
      primary: title
      sort: [title, nr_inwentarzowy]
      search: [title, nr_inwentarzowy, model]
    fields:
      - name: title
        label: Nazwa urządzenia
        type: string
        required: true
      - name: zdjecie
        label: Zdjęcie
        type: image
        options:
          media: images
      - name: stan
        label: Stan
        type: select
        options:
          values:
            - name: sprawne
              label: Sprawne
            - name: usterka
              label: Usterka — można używać ostrożnie
            - name: w-naprawie
              label: W naprawie
            - name: wycofane
              label: Wycofane z użytku
      - name: stanowisko
        label: Stanowisko
        description: Na którym stanowisku stoi urządzenie (pojawi się na stronie stanowiska).
        type: reference
        options:
          collection: stanowiska
          value: "{path}"
          label: "{title}"
      - name: model
        label: Producent / model
        type: string
      - name: nr_inwentarzowy
        label: Nr inwentarzowy
        type: string
      - name: instrukcja_pdf
        label: Instrukcja producenta (plik)
        type: file
        options:
          media: pliki
      - name: body
        label: Uwagi
        description: Zastosowania, znane problemy, akcesoria.
        type: rich-text
        options:
          format: markdown
          media: images

settings:
  commit:
    identity: user   # w historii repo widać, kto co zmienił
