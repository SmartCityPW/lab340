# Konfiguracja Pages CMS (https://pagescms.org/docs/configuration/)
# Określa, co osoby nietechniczne mogą edytować w panelu i jakimi polami.

media:
  - name: images
    label: Zdjęcia
    input: docs/images
    output: /images          # szablon strony sam przepisuje to na właściwą ścieżkę
    categories: [image]
    rename: safe
  - name: pliki
    label: Pliki (PDF, instrukcje producenta)
    input: docs/pliki
    output: /pliki
    categories: [document, spreadsheet, compressed]
    rename: safe

content:
  - name: ogolne
    label: Strony ogólne
    type: group
    items:
      - name: strona-glowna
        label: Strona główna
        type: file
        path: docs/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Tytuł
            type: string
            required: true
          - name: body
            label: Treść
            type: rich-text
            options:
              format: markdown
              media: images

      - name: info-ogolne
        label: Informacje wstępne
        type: file
        path: docs/info-wstepne.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Tytuł
            type: string
            required: true
          - name: body
            label: Treść
            type: rich-text
            options:
              format: markdown
              media: images
        

  - name: stanowiska
    label: Stanowiska
    type: collection
    path: docs/stanowiska
    format: yaml-frontmatter
    exclude: [index.md]
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
    fields:
      - name: title
        label: Nazwa stanowiska
        type: string
        required: true
      - name: zdjecie
        label: Zdjęcie stanowiska
        type: image
        options:
          media: images
      - name: body
        label: Opis i procedury
        description: Do czego służy stanowisko, co zrobić przed i po pracy.
        type: rich-text
        options:
          format: markdown
          media: images

  - name: instrukcje
    label: Instrukcje
    type: collection
    path: docs/instrukcje
    format: yaml-frontmatter
    exclude: [index.md]
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
    fields:
      - name: title
        label: Tytuł instrukcji
        type: string
        required: true
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown
          media: images

  - name: wyposazenie
    label: Wyposażenie laboratorium
    type: file
    path: docs/wyposazenie.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Tytuł
        type: string
        required: true
      - name: lista_wyposazenia
        label: Link do listy wyposażenia (Excel)
        description: Pełny adres arkusza, np. z OneDrive lub SharePoint. Na stronie pojawi się jako przycisk.
        type: string
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown
          media: images

settings:
  commit:
    identity: user   # w historii repo widać, kto co zmienił
