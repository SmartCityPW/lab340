# Konfiguracja strony (Zensical — następca Material for MkDocs).
# Dokumentacja opcji: https://zensical.org/docs/

[project]
site_name = "Laboratorium"
site_description = "Dokumentacja obsługi laboratorium: stanowiska, instrukcje, wyposażenie"
# TODO: podmień na docelowy adres, np. https://NAZWA-ORG.github.io/NAZWA-REPO/
site_url = "https://SmartCityPW.github.io/lab340/"
# TODO: podmień na adres repozytorium (pokazuje link do GitHuba w nagłówku)
repo_url = "https://github.com/SmartCityPW/lab340"
copyright = "Laboratorium - dokumentacja publiczna"

# Nawigacja nie jest wpisana na sztywno: buduje się automatycznie z folderów
# w docs/, więc strony dodane przez Pages CMS pojawiają się w menu same.
# Tytuły w menu biorą się z pola `title` na początku każdego pliku.

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "pl"
custom_dir = "overrides"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Tryb jasny"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Tryb ciemny"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Tryb systemowy"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
